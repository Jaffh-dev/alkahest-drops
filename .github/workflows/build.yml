# Builds the mod and runs every GameTest on each push and pull request.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --console=plain

      - name: Run GameTests
        run: ./gradlew runGameTestServer --console=plain

      - name: Upload GameTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: run-gametest/logs/
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: alkahestdrops-jar
          path: build/libs/*.jar
